<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17181c">
    <meta name="author" content="Md. Tanvir Rahman">
    <title>ModelForge 3D</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="device.css">
    <style>
        #creatorBadge{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;padding:3px 9px;border:1px solid #30323a;border-radius:3px;background:#15161bd9;color:#777b85;font-size:9px;letter-spacing:.15px;pointer-events:none;white-space:nowrap;backdrop-filter:blur(8px)}
        @media(max-width:760px){#creatorBadge{bottom:100px;left:50%;font-size:8px;padding:3px 7px;max-width:calc(100vw - 20px);overflow:hidden;text-overflow:ellipsis}}
        @media(max-width:380px){#creatorBadge{bottom:98px;font-size:7px}}
    </style>
    <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.181.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.181.1/examples/jsm/"}}
    </script>
</head>
<body>
    <header id="topbar">
        <div class="brand"><div class="brand-mark">MF</div><div class="brand-copy"><strong>ModelForge</strong><span>3D Editor</span></div></div>
        <nav class="app-menu" aria-label="Application menu"><button class="menu-item" id="fileMenuBtn">File</button><button class="menu-item" id="editMenuBtn">Edit</button><button class="menu-item" id="viewMenuBtn">View</button><button class="menu-item" id="addMenuBtn">Add</button></nav>
        <div class="top-actions"><button class="icon-btn mobile-panel-btn" id="mobileSceneBtn" title="Scene">☷</button><button class="icon-btn mobile-panel-btn" id="mobileInspectorBtn" title="Inspector">◇</button><button class="icon-btn mobile-panel-btn" id="mobileMoreBtn" title="All features">⋮</button><button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button><button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Y)">↷</button><span class="toolbar-divider"></span><button class="action-btn" id="loadBtn">Open</button><button class="action-btn primary" id="saveBtn">Save</button><button class="action-btn" id="exportBtn">Export</button><button class="action-btn" id="uploadBtn">Part</button></div>
    </header>
    <div id="menuPopover" class="menu-popover" hidden></div><div id="mobileBackdrop" hidden></div>
    <main id="editor">
        <aside id="leftPanel" class="panel"><div class="panel-header"><div><span class="eyebrow">Workspace</span><h2>Scene</h2></div><button class="panel-icon" id="sceneAddBtn" title="Add object">+</button></div><div class="scene-tools"><div class="search-box"><span>⌕</span><input id="sceneSearch" type="search" placeholder="Search scene..." autocomplete="off"></div><button class="panel-icon" id="sceneOptionsBtn" title="Scene options">⋮</button></div><div class="scene-tree-wrap"><div class="tree-label">SCENE COLLECTION</div><ul id="sceneTree" aria-label="Scene hierarchy"></ul></div><div class="left-footer"><button class="footer-tool" id="addCollectionBtn">+ Collection</button><button class="footer-tool" id="importBtn">Import</button></div></aside>
        <section id="viewport" aria-label="3D viewport"><div id="app"></div><div class="viewport-overlay viewport-top-left"><div class="viewport-chip"><span class="live-dot"></span><span id="viewModeLabel">Perspective</span></div><div class="viewport-chip muted">User Perspective</div></div><div class="viewport-overlay viewport-top-right"><button class="viewport-btn" id="gridBtn">Grid</button><button class="viewport-btn" id="frameBtn">Frame</button><button class="viewport-btn" id="cameraResetBtn">Reset View</button></div><div class="viewport-gizmo" id="viewportGizmo" aria-label="Viewport orientation"><button data-axis="x">X</button><button data-axis="y">Y</button><button data-axis="z">Z</button></div><div class="viewport-axis" aria-hidden="true"><span class="axis-x">X</span><span class="axis-y">Y</span><span class="axis-z">Z</span></div><div class="viewport-overlay viewport-bottom-left"><span>LMB Select</span><span>MMB Orbit</span><span>Shift+MMB Pan</span></div></section>
        <aside id="rightPanel" class="panel"><div class="panel-header inspector-header"><div><span class="eyebrow">Properties</span><h2>Inspector</h2></div><button class="panel-icon" id="inspectorOptionsBtn">⋮</button></div><div class="inspector-tabs"><button class="inspector-tab active" data-tab="object">Object</button><button class="inspector-tab" data-tab="material">Material</button></div><div id="inspectorContent"></div></aside>
    </main>
    <div id="bottomToolbar"><div class="tool-group"><button id="selectBtn" class="tool-btn active" title="Select (W)">↖ <span>Select</span></button><button id="moveBtn" class="tool-btn" title="Move (G)">✥ <span>Move</span></button><button id="rotateBtn" class="tool-btn" title="Rotate (R)">⟳ <span>Rotate</span></button><button id="scaleBtn" class="tool-btn" title="Scale (S)">⌗ <span>Scale</span></button></div><span class="toolbar-divider"></span><div class="tool-group"><button id="snapBtn" class="tool-btn">Snap Off</button><button id="groupBtn" class="tool-btn">Group</button><button id="ungroupBtn" class="tool-btn">Ungroup</button></div></div>
    <footer id="statusBar"><div class="status-left"><span class="status-indicator"></span><span id="statusText">Ready</span></div><div class="status-center">ModelForge 3D · Created by Md. Tanvir Rahman</div><div class="status-right"><span>Objects <strong id="objectCount">0</strong></span><span>FPS <strong id="fpsCounter">--</strong></span></div></footer>
    <div id="creatorBadge" aria-label="ModelForge creator">Created by Md. Tanvir Rahman</div>
    <input id="fileInput" type="file" accept=".glb,.gltf,.json" hidden>
    <script type="module" src="main.js?v=20260811-runtime-fix-2"></script>
    <script type="module">
        import { initDeviceExperience } from "./core/deviceExperience.js?v=20260811-scene-instance-fix";
        import { initCommandCenter, openCommandCenter } from "./core/commandCenter.js?v=20260811-runtime-fix-2";
        import { initNumericTransform } from "./core/numericTransform.js?v=20260811-runtime-fix-2";
        import { initProjectPersistence } from "./core/projectPersistence.js?v=20260811-persistence-1";
        import { scene } from "./core/scene.js?v=20260811-runtime-fix";
        const start = () => { initDeviceExperience(); initCommandCenter(); initNumericTransform(); initProjectPersistence(scene); const bindings = [["fileMenuBtn","file"],["editMenuBtn","edit"],["viewMenuBtn","view"],["addMenuBtn","add"],["mobileMoreBtn","more"],["inspectorOptionsBtn","more"]]; bindings.forEach(([id,section]) => document.getElementById(id)?.addEventListener("click", event => { event.stopPropagation(); openCommandCenter(section, event.currentTarget); })); };
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once: true }); else start();
    </script>
</body>
</html>
