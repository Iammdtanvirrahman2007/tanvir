<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="author" content="Md. Tanvir Rahman">
<meta name="description" content="ModelForge 3D browser-based modeling editor.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ModelForge 3D</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/model-forge-192.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="device.css">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.181.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.181.1/examples/jsm/"}}</script>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <div class="brand-mark">MF</div>
    <div class="brand-copy"><strong>ModelForge</strong><span>3D Builder</span></div>
  </div>
  <nav class="app-menu" aria-label="Application">
    <button class="menu-item" id="fileMenuBtn">File</button>
    <button class="menu-item" id="editMenuBtn">Edit</button>
    <button class="menu-item" id="viewMenuBtn">View</button>
    <button class="menu-item" id="addMenuBtn">Add</button>
  </nav>
  <div class="top-actions">
    <button class="icon-btn" id="undoBtn" title="Undo">↶</button>
    <button class="icon-btn" id="redoBtn" title="Redo">↷</button>
    <span class="toolbar-divider"></span>
    <button class="action-btn" id="loadBtn">Open</button>
    <button class="action-btn primary" id="saveBtn">Save</button>
    <button class="action-btn" id="exportBtn">Export</button>
    <button class="action-btn" id="rocketPartBtn">Rocket Part</button>
    <button class="action-btn" id="uploadBtn" style="display:none">Part</button>
    <button class="icon-btn mobile-panel-btn" id="mobileSceneBtn" title="Scene">☷</button>
    <button class="icon-btn mobile-panel-btn" id="mobileInspectorBtn" title="Inspector">◇</button>
    <button class="icon-btn mobile-panel-btn" id="mobileMoreBtn" title="More">⋮</button>
  </div>
</header>
<div id="menuPopover" class="menu-popover" hidden></div>
<div id="mobileBackdrop" hidden></div>

<main id="editor">
  <aside id="leftPanel" class="panel">
    <div class="panel-header">
      <div><span class="eyebrow">Project</span><h2>Scene</h2></div>
      <button class="panel-icon" id="sceneAddBtn" title="Add object">+</button>
    </div>
    <div class="scene-tools">
      <div class="search-box"><span>⌕</span><input id="sceneSearch" type="search" placeholder="Search objects..." autocomplete="off"></div>
      <button class="panel-icon" id="sceneOptionsBtn" title="Scene options">⋮</button>
    </div>
    <div class="scene-tree-wrap">
      <div class="tree-label">OBJECTS</div>
      <ul id="sceneTree" aria-label="Scene hierarchy"></ul>
    </div>
    <div class="left-footer">
      <button class="footer-tool" id="addCollectionBtn">+ Collection</button>
      <button class="footer-tool" id="importBtn">Import</button>
    </div>
  </aside>

  <section id="viewport" aria-label="3D viewport">
    <div id="app"></div>
    <div class="viewport-overlay viewport-top-left">
      <div class="viewport-chip"><span class="live-dot"></span><span id="viewModeLabel">Perspective</span></div>
      <div class="viewport-chip muted">User Perspective</div>
    </div>
    <div class="viewport-overlay viewport-top-right">
      <button class="viewport-btn" id="gridBtn">Grid</button>
      <button class="viewport-btn" id="frameBtn">Frame</button>
      <button class="viewport-btn" id="cameraResetBtn">Reset</button>
    </div>
    <div class="viewport-gizmo" id="viewportGizmo"><button data-axis="x">X</button><button data-axis="y">Y</button><button data-axis="z">Z</button></div>
    <div class="viewport-axis"><span class="axis-x">X</span><span class="axis-y">Y</span><span class="axis-z">Z</span></div>
  </section>

  <aside id="rightPanel" class="panel">
    <div class="panel-header inspector-header">
      <div><span class="eyebrow">Properties</span><h2>Inspector</h2></div>
      <button class="panel-icon" id="inspectorOptionsBtn" title="Inspector options">⋮</button>
    </div>
    <div class="inspector-tabs">
      <button class="inspector-tab active" data-tab="object">Object</button>
      <button class="inspector-tab" data-tab="material">Material</button>
    </div>
    <div id="inspectorContent"></div>
  </aside>
</main>

<div id="bottomToolbar">
  <div class="tool-group primary-tools">
    <button id="selectBtn" class="tool-btn active">↖<span>Select</span></button>
    <button id="moveBtn" class="tool-btn">✥<span>Move</span></button>
    <button id="rotateBtn" class="tool-btn">⟳<span>Rotate</span></button>
    <button id="scaleBtn" class="tool-btn">⌗<span>Scale</span></button>
  </div>
  <span class="toolbar-divider"></span>
  <div class="tool-group utility-tools">
    <button id="snapBtn" class="tool-btn">Snap</button>
    <button id="groupBtn" class="tool-btn">Group</button>
    <button id="ungroupBtn" class="tool-btn">Ungroup</button>
  </div>
</div>

<footer id="statusBar">
  <div class="status-left"><span class="status-indicator"></span><span id="statusText">Ready</span></div>
  <div class="status-center">ModelForge 3D</div>
  <div class="status-right"><span>Objects <strong id="objectCount">0</strong></span><span>FPS <strong id="fpsCounter">--</strong></span></div>
</footer>

<input id="fileInput" type="file" accept=".glb,.gltf,.json" hidden>
<script type="module" src="main.js?v=20260908-ui-reset-1"></script>
<script type="module">
import{initDeviceExperience}from"./core/deviceExperience.js?v=20260908-ui-reset-1";
import{initCommandCenter,openCommandCenter}from"./core/commandCenter.js?v=20260908-ui-reset-1";
import{initNumericTransform}from"./core/numericTransform.js?v=20260908-ui-reset-1";
import{initProjectPersistence}from"./core/projectPersistence.js?v=20260908-ui-reset-1";
import{initModelingUI}from"./core/modelingUI.js?v=20260908-ui-reset-1";
import{initRecoveryUI}from"./core/recoveryUI.js?v=20260908-ui-reset-1";
import{initRocketNodeUiFix}from"./ui/rocketNodeUiFix.js";
import{scene}from"./core/scene.js?v=20260811-runtime-fix";
const start=()=>{initDeviceExperience();initCommandCenter();initNumericTransform();initProjectPersistence(scene);initModelingUI();initRecoveryUI();initRocketNodeUiFix();[["fileMenuBtn","file"],["editMenuBtn","edit"],["viewMenuBtn","view"],["addMenuBtn","add"],["mobileMoreBtn","more"],["inspectorOptionsBtn","more"]].forEach(([id,section])=>document.getElementById(id)?.addEventListener("click",e=>{e.stopPropagation();openCommandCenter(section,e.currentTarget)}))};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
</script>
<script src="pwa-register.js?v=20260908-ui-reset-1" defer></script>
</body>
</html>
